[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license-file = "LICENCE"
authors = ["Chris Wells Wood <chris.wood@ed.ac.uk>"]

[workspace.dependencies]
lattice-core = { path = "crates/lattice-core" }
lattice-engine = { path = "crates/lattice-engine" }
lattice-editor = { path = "crates/lattice-editor" }

# Lattice shouldn't panic: outside tests, failures are handled, not unwrapped.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# Indexing panics when it's out of range; see AGENTS.md.
indexing_slicing = "deny"
