[package]
name = "lattice-tui"
description = "Terminal frontend for Lattice."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

[[bin]]
name = "lattice"
path = "src/main.rs"

[dependencies]
anyhow = "1"
assert_no_alloc = "1.1"
cpal = "0.18"
midir = "0.11"
lattice-core.workspace = true
lattice-editor.workspace = true
lattice-engine.workspace = true
ratatui = "0.30"
rtrb = "0.4"
toml = "1"
terminal-colorsaurus = "1.0.3"

# To keep unsaved changes when the terminal's closed.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

# PulseAudio's host, which PipeWire serves too, names the devices as the desktop does.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
# To record an app's own sound, which cpal can't.
futures = "0.3"
pulseaudio = "0.3"

[lints]
workspace = true
