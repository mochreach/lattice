# Builds and tests Lattice on Linux, macOS and Windows. Only Linux is played on; the others are
# checked to build and pass their tests, as a start.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The cache moves between runners with different CPUs, so it's built for none in particular,
# rather than for this one's, as .cargo/config.toml asks.
env:
  RUSTFLAGS: ""
jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cpal and midir link against ALSA on Linux.
      - name: ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo build --release
      - run: cargo test --workspace --no-fail-fast
